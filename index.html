<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIMM - Portal de la Comunidad Musical de Mendoza</title>
    
    <!-- Fuente Urbanist -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#09090b">

    <style>
        :root {
            --bg-deep: #09090b;
            --card-bg: rgba(24, 24, 27, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-red: #ef4444;
            --hover-red: #dc2626;
            --accent-yellow: #facc15;
            --text-light: #f4f4f5;
            --text-muted: #a1a1aa;
            --radius: 16px;
        }

        body {
            font-family: 'Urbanist', sans-serif, system-ui;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(239, 68, 68, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(250, 204, 21, 0.08) 0%, transparent 40%);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 28px;
            border-radius: var(--radius);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        h2 {
            font-family: 'Urbanist', sans-serif;
            color: var(--accent-yellow);
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 22px;
        }

        /* Sistema de pestañas en el orden correcto */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 22px;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            min-width: 85px;
            padding: 10px 4px;
            border: none;
            background: transparent;
            font-weight: 700;
            font-size: 0.72rem;
            font-family: 'Urbanist', sans-serif;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .tab-btn.active {
            background: var(--primary-red);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        .tab-btn:hover:not(.active) {
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Contenedor del Módulo (Iframe limpio y aislado) */
        .module-frame-container {
            width: 100%;
            background: rgba(9, 9, 11, 0.6);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-height: 750px;
        }
        iframe {
            width: 100%;
            height: 750px;
            border: none;
            background: transparent;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>MIMM - Comunidad Musical</h2>
    <div class="subtitle">Portal Oficial de la Música Mendocina</div>

    <!-- Pestañas ordenadas estrictamente de izquierda a derecha -->
    <div class="tabs">
        <button class="tab-btn active" type="button" onclick="cargarModulo('tarifario.html', this)">💰 Tarifario</button>
        <button class="tab-btn" type="button" onclick="cargarModulo('facturacion.html', this)">🧾 Facturación</button>
        <button class="tab-btn" type="button" onclick="cargarModulo('trabajo.html', this)">📋 Bolsa de trabajo</button>
        <button class="tab-btn" type="button" onclick="cargarModulo('agenda.html', this)">🎸 Agenda</button>
        <button class="tab-btn" type="button" onclick="cargarModulo('publicar.html', this)">➕ Publicar</button>
    </div>

    <!-- Contenedor modular por Iframe (inicia en tarifario.html acorde a la primera pestaña activa) -->
    <div class="module-frame-container">
        <iframe id="moduloFrame" src="tarifario.html" title="Módulo MIMM"></iframe>
    </div>

    <div class="footer">
        Movimiento Independiente de Músicos de Mendoza (MIMM)
    </div>
</div>

<script>
    function cargarModulo(archivoHtml, boton) {
        // Actualizar clases activas de las pestañas
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        boton.classList.add('active');

        // Cambiar la fuente del iframe al archivo correspondiente
        document.getElementById('moduloFrame').src = archivoHtml;
    }
</script>

</body>
</html>
